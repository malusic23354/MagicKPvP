name: MagicKPvP
version: '1.2.2'
main: net.malusic.magickpvp.PluginManager
loader: net.malusic.magickpvp.loader.MagicKPvPPluginLoader
api-version: '1.21.9'
description: MagicKPvP is a plugin for kitpvp servers with custom kits and cool abilities.
authors:
  - Malusic
dependencies:
  server:
    Vault:
      load: BEFORE
      required: true
    WorldGuard:
      load: BEFORE
      required: false
    LuckPerms:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
    Nexo:
      load: BEFORE
      required: false

permissions:
  magickpvp.command:
    description: Allows use of /magickpvp.
    default: true
  magickpvp.menu:
    description: Allows opening the kit menu.
    default: true
  magickpvp.select:
    description: Allows selecting owned kits.
    default: true
  magickpvp.buy:
    description: Allows buying kits.
    default: true
  magickpvp.sell:
    description: Allows selling purchased kits.
    default: true
  magickpvp.info:
    description: Allows viewing plugin info.
    default: true
  magickpvp.xp:
    description: Allows viewing your own XP.
    default: true
  magickpvp.xp.admin:
    description: Allows adding, removing and setting player XP.
    default: op
  magickpvp.stats:
    description: Allows viewing player stats.
    default: true
  magickpvp.top:
    description: Allows viewing the leaderboards.
    default: true
  magickpvp.kitusage:
    description: Allows viewing how often each kit was purchased.
    default: op
  magickpvp.advancements:
    description: Allows opening the advancements menu.
    default: true
  magickpvp.spawn:
    description: Allows teleporting to spawn.
    default: true
  magickpvp.setspawn:
    description: Allows setting the spawn point.
    default: op
  magickpvp.arena:
    description: Allows teleporting to the arena.
    default: true
  magickpvp.arena.admin:
    description: Allows adding, updating and removing arena spots.
    default: op
  magickpvp.reload:
    description: Allows reloading all configuration files.
    default: op
  magickpvp.bypass:
    description: Allows moving kit items into other inventories and dropping them.
    default: op
  magickpvp.kit.*:
    description: Grants ownership of every kit without buying it. Individual kits use magickpvp.kit.<id>.
    default: false
  magickpvp.admin:
    description: All MagicKPvP permissions.
    default: op
    children:
      magickpvp.command: true
      magickpvp.menu: true
      magickpvp.select: true
      magickpvp.buy: true
      magickpvp.sell: true
      magickpvp.info: true
      magickpvp.xp: true
      magickpvp.xp.admin: true
      magickpvp.stats: true
      magickpvp.top: true
      magickpvp.kitusage: true
      magickpvp.advancements: true
      magickpvp.spawn: true
      magickpvp.setspawn: true
      magickpvp.arena: true
      magickpvp.arena.admin: true
      magickpvp.reload: true
      magickpvp.bypass: true
      magickpvp.kit.*: true
