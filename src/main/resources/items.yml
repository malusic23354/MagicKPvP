example_kit:
  name: "<dark_purple>Example Kit"

  price:
    buy: 1000
    sell: 550

  sword:
    name: "<dark_purple>Ability Sword"
    material: NETHERITE_SWORD
    amount: 1
    glow: true

    # Format: ENCHANTMENT:LEVEL
    enchantments:
      - sharpness:4
      - unbreaking:3
      - mending:1

    # Item attributes
    attributes:
      - attribute: attack_damage
        amount: 15
        operation: add_number
        slot: mainhand
        type: override
        text: "<gold>+15 Attack Damage"

    lore:
      - "<gray>An example custom item."
      - "<light_purple>Contains multiple abilities."

    # Item cooldown, applied by your ability handler
    cooldown: 30s

    # Item potion metadata (for potion-compatible materials)
    potion:
      type: speed
      duration: 30s
      amplifier: 1

    # Named ability sections
    abilities:

      flight:
        type: flight
        duration: 10s

      potion_boost:
        type: potion_effect
        duration: 15s
        effects:
          - speed:2
          - strength:1

      radius_attack:
        type: radiuseffect
        shape: circular
        width: 5
        range: 10
        duration: 3s
        particle:
          type: flame
          amount: 20
          speed: 0.1
        effects:
          - slowness:2
          - weakness:1
          - fire
        activationmessage:
          - for: target
            message: "<red>You were hit by a radius ability!"
          - for: inflictor
            message: "<green>Your radius ability activated!"

      projectile_attack: #this is made for projectiles.
        type: projected
        range: 15
        duration: 5s
        effects:
          - poison:1
        commands:
          - "say Targeted ability activated"

      random_target:
        type: randomized_target
        range: 20
        duration: 5s
        effects:
          - blindness:1