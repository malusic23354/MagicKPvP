enablemenu: true
materialnotowned: GRAY_DYE
lorenotowned: '<gray>Click to buy for {price}!'
lorebought: '<gray>Click to select this kit!'
lorelocked: '<red>Requires {requirement}'

storage:
  type: sqlite
  sqlite:
    file: data.db
  mysql:
    host: localhost
    port: 3306
    database: magickpvp
    username: root
    password: ""
    use-ssl: false
    pool-size: 10

protect-kit-items: true

rewards:
  kill:
    coins: 100
    xp: 10
  damage-share:
    enabled: true
    threshold: 0.5
    window-seconds: 60
    coins: 50
    xp: 5

ranks:
  enabled: false
  track: ranks
  groups:
    recruit: 0
    soldier: 500
    knight: 2000
    champion: 10000

combat:
  tag-seconds: 15
  block-kit-switch: true

menu-item:
  enabled: true
  slot: 4
  material: NETHER_STAR
  name: "<gold>Kit Selector"
  glow: true
  lore:
    - "<gray>Right click to choose a kit."

stats:
  leaderboard-size: 10
  leaderboard-refresh-seconds: 60

cooldown-display:
  enabled: true
  mode: held
  show-ready: true

cooldown-reduction:
  enabled: true
  max-percent: 75
  entries:
    - permission: magickpvp.cooldown.vip
      percent: 10
    - permission: group.knight
      percent: 10
    - permission: group.champion
      percent: 20

kit-requirements:
  enabled: true

cooldown-reset-on-death: false

streak-rewards:
  enabled: true
  rewards:
    - streak: 3
      coins: 50
      xp: 10
    - streak: 5
      coins: 150
      xp: 25
      broadcast: "<gold>{player} <gray>is on a <red>{streak} <gray>kill streak!"
    - streak: 10
      repeat: true
      coins: 500
      xp: 100
      commands:
        - "say {player} reached a {streak} kill streak"
      broadcast: "<gold>{player} <gray>is unstoppable with <red>{streak} <gray>kills in a row!"

menu:
  size: 36
  pages: 1
  autofill: true
  decoration: BLACK_STAINED_GLASS_PANE
  kits:
    - id: pyromancer
      slot: 10
      page: 1
      displayitem: staff
      lore:
        - ""
        - "<gold>Inferno Aura<gray>: burns everyone around you."
        - "<gold>Ashwalker Boots<gray>: passive speed and fire resistance."
        - "<dark_gray>Right click to preview."
    - id: stormcaller
      slot: 12
      page: 1
      displayitem: rod
      lore:
        - ""
        - "<aqua>Thunder Staff<gray>: chain lightning between enemies."
        - "<aqua>Storm Step<gray>: damaging dash."
        - "<dark_gray>Right click to preview."
    - id: shadow
      slot: 14
      page: 1
      displayitem: dagger
      lore:
        - ""
        - "<dark_gray>Nightfang<gray>: rewind your position and health."
        - "<dark_gray>Mirror Shard<gray>: leave a decoy and vanish."
        - "<dark_red>Bloodlust<gray>: kills stack speed and strength."
        - "<dark_gray>Right click to preview."
    - id: summoner
      slot: 16
      page: 1
      displayitem: whistle
      lore:
        - ""
        - "<green>Pack Whistle<gray>: summons fighting wolves."
        - "<green>Healing Idol<gray>: plants a healing totem."
        - "<dark_gray>Right click to preview."
    - id: voidwalker
      slot: 20
      page: 1
      displayitem: singularity
      lore:
        - ""
        - "<dark_purple>Singularity<gray>: a black hole that pulls enemies in."
        - "<dark_purple>Void Wings<gray>: temporary flight."
        - "<dark_purple>Silence Shard<gray>: blocks nearby abilities."
        - "<dark_gray>Right click to preview."
    - id: trickster
      slot: 22
      page: 1
      displayitem: bow
      lore:
        - ""
        - "<light_purple>Hexing Bow<gray>: poisons, slows and silences."
        - "<light_purple>Swap Shard<gray>: trade places with a player."
        - "<light_purple>Chaos Compass<gray>: curses a random player."
        - "<dark_gray>Right click to preview."
    - id: warden
      slot: 24
      page: 1
      displayitem: hammer
      lore:
        - ""
        - "<red>Warden's Maul<gray>: box shaped crushing zone."
        - "<red>Ward Core<gray>: sphere that marks enemies."
        - "<red>Plate<gray>: passive resistance and absorption."
        - "<dark_gray>Right click to preview."
