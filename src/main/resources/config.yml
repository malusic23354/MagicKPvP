#################### [ MagicKPvP ] ########################################################
# Configuration file made for the user to change the plugins configuration as they please.#
# Storage types: sqlite or mysql more in the future!                                      #
###########################################################################################
enablemenu: true
materialnotowned: GRAY_DYE
lorenotowned: '<gray>Click to buy for {price}!'
lorebought: '<gray>Click to select this kit!'
storage:
  type: sqlite
  sqlite:
    file: data.db
  mysql:
    host: localhost
    port: 3306
    database: magickpvp
    username: root
    password: ""
    use-ssl: false
    pool-size: 10
menu:
  size: 27
  pages: 1
  autofill: true
  decoration: BLACK_STAINED_GLASS_PANE
  kits:
    - id: example_kit
      slot: 10
      page: 1
      displayitem: sword