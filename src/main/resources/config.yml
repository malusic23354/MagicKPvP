#################### [ MagicKPvP ] ########################################################
# Configuration file made for the user to change the plugins configuration as they please.#
# Storage types: sqlite or mysql more in the future!                                      #
###########################################################################################
enablemenu: true

materialnotowned: GRAY_DYE

lorenotowned: '<gray>Click to buy for {price}!'

lorebought: '<gray>Click to select this kit!'

storage:
  type: sqlite
  sqlite:
    file: data.db
  mysql:
    host: localhost
    port: 3306
    database: magickpvp
    username: root
    password: ""
    use-ssl: false
    pool-size: 10

menu:
  size: 27
  pages: 1
  autofill: true
  decoration: BLACK_STAINED_GLASS_PANE
  kits:
    - id: example_kit
      slot: 10
      page: 1
      displayitem: sword

protect-kit-items: true

rewards:
  kill:
    coins: 100.0
    xp: 10
  damage-share:
    enabled: true
    threshold: 0.5
    window-seconds: 60
    coins: 50.0
    xp: 5

ranks:
  enabled: false
  track: ""
  groups:
    default: 0
    vip: 1000
    mvp: 5000

combat:
  tag-seconds: 15
  block-kit-switch: true